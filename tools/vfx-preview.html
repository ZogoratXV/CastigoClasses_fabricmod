<!doctype html><meta charset="utf-8"><title>Castigo — revisione geometrie VFX</title>
<style>body{margin:0;background:#111820;color:#e7dfcb;font:16px system-ui}header{padding:18px 28px;border-bottom:1px solid #46525b}h1{font-size:22px;margin:0 0 6px}p{margin:0;color:#a9b7bd}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}article{position:relative;border:1px solid #344750;background:#19282e}h2{position:absolute;top:4px;left:20px;font-size:17px}canvas{width:100%;height:350px;display:block}footer{padding:0 28px 20px;color:#a9b7bd}button{float:right;background:#30454c;color:white;border:1px solid #82949c;padding:8px 16px}</style>
<header><input id="phase" aria-label="Fotogramma" type="range" min="0" max="39" value="8"><button id="pause">Pausa</button><h1>Castigo · beta.11</h1><p>Geometrie e texture della mod — anteprima tecnica, non ripresa in Minecraft.</p></header><main></main><footer>Griglia: 1 blocco. Sagoma centrale: altezza 1,8 blocchi. Illuminazione e trasparenze del gioco possono differire.</footer>
<script>
let paused=false;document.querySelector('button').onclick=()=>{paused=!paused;document.querySelector('button').textContent=paused?'Riprendi':'Pausa'};
document.querySelector('input').oninput=()=>{paused=true;document.querySelector('button').textContent='Riprendi'};const names={HEALING_BEAM:'Orison · luce e particelle ascendenti',MESH_BURST:'Impatto · nucleo, onda e frammenti',MESH_BEAM:'Scia · volume e correnti intrecciate',MESH_RING:'Sigillo · rune e scintille'};
const data=fetch('../build/vfx-preview.json').then(r=>r.json());
function make(gl,type,s){let x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
async function setup(shape,frames){let a=document.createElement('article');a.innerHTML='<h2>'+names[shape]+'</h2><canvas width="700" height="390"></canvas>';document.querySelector('main').append(a);let c=a.querySelector('canvas'),g=c.getContext('webgl');
let p=g.createProgram();g.attachShader(p,make(g,g.VERTEX_SHADER,`attribute vec3 position;attribute vec2 uv;attribute vec4 color;varying vec2 U;varying vec4 C;void main(){float a=.68;vec3 v=position;float x=cos(a)*v.x-sin(a)*v.z;float z=sin(a)*v.x+cos(a)*v.z;gl_Position=vec4(x/4.5,(v.y*.86-z*.5-.8)/2.5,-(z*.86+v.y*.5)/30.,1.);U=uv;C=color;}`));g.attachShader(p,make(g,g.FRAGMENT_SHADER,`precision mediump float;varying vec2 U;varying vec4 C;uniform sampler2D tex;void main(){gl_FragColor=texture2D(tex,U)*C;if(gl_FragColor.a<.02)discard;}`));g.linkProgram(p);g.useProgram(p);
let buf=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,buf);for(let [name,n,off] of [['position',3,0],['uv',2,12],['color',4,20]]){let l=g.getAttribLocation(p,name);g.enableVertexAttribArray(l);g.vertexAttribPointer(l,n,g.FLOAT,false,36,off)}
const textures={};for(let path of new Set(frames.flat().map(l=>l.texture))){let img=new Image();img.src='../src/main/resources/assets/'+path.replace(':','/');await img.decode();let t=g.createTexture();g.bindTexture(g.TEXTURE_2D,t);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,img);for(let q of [g.TEXTURE_MIN_FILTER,g.TEXTURE_MAG_FILTER])g.texParameteri(g.TEXTURE_2D,q,g.NEAREST);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);textures[path]=t}
let white=g.createTexture();g.bindTexture(g.TEXTURE_2D,white);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,1,1,0,g.RGBA,g.UNSIGNED_BYTE,new Uint8Array([255,255,255,255]));g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.NEAREST);
function draw(v,t){let arr=[];for(let k=0;k<v.length;k+=4)for(let j of [0,1,2,0,2,3]){let x=v[k+j],rgb=x.color>>>0;arr.push(x.x,x.y,x.z,x.u,x.v,((rgb>>>16)&255)/255,((rgb>>>8)&255)/255,(rgb&255)/255,(rgb>>>24)/255)}g.bindTexture(g.TEXTURE_2D,t);g.bufferData(g.ARRAY_BUFFER,new Float32Array(arr),g.DYNAMIC_DRAW);g.drawArrays(g.TRIANGLES,0,arr.length/9)}
function quad(v,pts,color){for(let i=0;i<4;i++)v.push({x:pts[i][0],y:pts[i][1],z:pts[i][2],u:i%2,v:i<2?0:1,color})}
let floor=[];for(let x=-6;x<6;x++)for(let z=-6;z<6;z++)quad(floor,[[x,-.06,z],[x+1,-.06,z],[x+1,-.06,z+1],[x,-.06,z+1]],(x+z)%2?0xff24363b:0xff293d42);
let actor=[];for(let [x0,x1,y0,y1,z0,z1] of [[-.3,.3,0,1.35,-.18,.18],[-.25,.25,1.35,1.85,-.25,.25]]){quad(actor,[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],0xff536168);quad(actor,[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],0xff75848a);quad(actor,[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],0xff97a3a5)}
let age=8,last=performance.now();function render(now){if(!paused)age=(age+(now-last)/50)%40;else age=Number(document.querySelector("input").value);last=now;g.viewport(0,0,c.width,c.height);g.clearColor(.065,.1,.12,1);g.clear(g.COLOR_BUFFER_BIT|g.DEPTH_BUFFER_BIT);g.enable(g.DEPTH_TEST);g.depthMask(true);g.disable(g.BLEND);draw(floor,white);if(shape!=='MESH_BEAM')draw(actor,white);g.enable(g.BLEND);g.blendFunc(g.SRC_ALPHA,g.ONE_MINUS_SRC_ALPHA);g.depthMask(false);for(let layer of frames[Math.floor(age)])draw(layer.vertices,textures[layer.texture]);requestAnimationFrame(render)}requestAnimationFrame(render)}
data.then(async d=>{for(let [k,v] of Object.entries(d))await setup(k,v)}).catch(e=>document.querySelector('footer').textContent=e);
</script>
